<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Java Strings</h1>
    <p>JavaScript strings are used for storing and manipulating text. A string can be any text inside double or single
        quotes.</p>
    <script>
        var str = "I am learning JavaScript";
        document.write(str.toUpperCase());
        document.write("<br>");
        document.write(str.toLowerCase());
        document.write("<br>");
        document.write(str.startsWith("i"));
        // test method returns to true or false
        var st1 = "Hello, World!";
        var patt = new RegExp("Hello");
        var res = patt.test(st1);
        document.write(res);

    </script>
</body>

</html>
